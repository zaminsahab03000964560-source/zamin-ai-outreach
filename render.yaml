services:
  - type: web
    name: z2-digital-private-preview
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: z2-digital-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/z2digital.sqlite
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        value: 71a2e155-47b9-455e-b107-f8d037a863cd
      - key: WORKSPACE_ADMIN_TOKEN
        generateValue: true
